<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Animated data dashboard on a laptop">
  <style>
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 6s ease-in-out infinite both}
    .b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}.b5{animation-delay:.6s}
    @keyframes grow{0%{transform:scaleY(0)}20%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}
    .trend{stroke-dasharray:1;animation:draw 6s ease-in-out infinite both}
    @keyframes draw{0%,15%{stroke-dashoffset:1}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
    .ring{stroke-dasharray:0 100;animation:fill 6s ease-in-out infinite both}
    @keyframes fill{0%,10%{stroke-dasharray:0 100}35%,85%{stroke-dasharray:70 100}100%{stroke-dasharray:0 100}}
    .float{animation:float 4s ease-in-out infinite}
    .f2{animation-delay:1s}.f3{animation-delay:2s}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .blink{animation:blink 2s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
  </style>

  <!-- floating sparkles / dots -->
  <g class="float">
    <path d="M44 52 L48 64 L60 68 L48 72 L44 84 L40 72 L28 68 L40 64 Z" fill="#FF69B4"/>
  </g>
  <g class="float f2">
    <path d="M356 44 L359 52 L367 55 L359 58 L356 66 L353 58 L345 55 L353 52 Z" fill="#8A2BE2"/>
  </g>
  <g class="float f3">
    <circle cx="370" cy="150" r="7" fill="#FF69B4" opacity=".8"/>
    <circle cx="30" cy="150" r="5" fill="#8A2BE2" opacity=".8"/>
  </g>

  <!-- laptop -->
  <rect x="64" y="34" width="272" height="182" rx="14" fill="#1e1b2e" stroke="#9aa0b4" stroke-width="6"/>
  <path d="M30 222 H370 L352 244 Q350 248 344 248 H56 Q50 248 48 244 Z" fill="#9aa0b4"/>
  <rect x="164" y="222" width="72" height="8" rx="4" fill="#7d8398"/>

  <!-- window dots -->
  <circle cx="86" cy="54" r="4" fill="#FF69B4"/>
  <circle cx="99" cy="54" r="4" fill="#8A2BE2"/>
  <circle cx="112" cy="54" r="4" fill="#4fd1c5"/>
  <rect x="236" y="50" width="84" height="8" rx="4" fill="#3b3652"/>

  <!-- bar chart -->
  <line x1="84" y1="190" x2="244" y2="190" stroke="#3b3652" stroke-width="2"/>
  <rect class="bar b1" x="94"  y="150" width="22" height="40" rx="4" fill="#FF69B4"/>
  <rect class="bar b2" x="124" y="126" width="22" height="64" rx="4" fill="#8A2BE2"/>
  <rect class="bar b3" x="154" y="140" width="22" height="50" rx="4" fill="#FF69B4"/>
  <rect class="bar b4" x="184" y="104" width="22" height="86" rx="4" fill="#8A2BE2"/>
  <rect class="bar b5" x="214" y="118" width="22" height="72" rx="4" fill="#FF69B4"/>
  <path class="trend" pathLength="1" d="M105 138 L135 114 L165 128 L195 92 L225 106" fill="none" stroke="#ffd1e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- donut -->
  <circle cx="288" cy="118" r="30" fill="none" stroke="#3b3652" stroke-width="12"/>
  <circle class="ring" pathLength="100" cx="288" cy="118" r="30" fill="none" stroke="#FF69B4" stroke-width="12" stroke-linecap="round" transform="rotate(-90 288 118)"/>
  <text x="288" y="123" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">70%</text>
  <rect x="258" y="160" width="60" height="6" rx="3" fill="#3b3652"/>
  <rect x="258" y="174" width="40" height="6" rx="3" fill="#3b3652"/>

  <!-- cursor blink -->
  <rect class="blink" x="84" y="76" width="3" height="12" rx="1.5" fill="#4fd1c5"/>
  <rect x="94" y="79" width="70" height="6" rx="3" fill="#3b3652"/>
</svg>
