<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="End of transmission">
<defs>
<linearGradient id="nameg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#F3E8FF"/><stop offset="0.5" stop-color="#C084FC"/><stop offset="1" stop-color="#9B5DE5"/>
</linearGradient>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#C084FC"/><stop offset="1" stop-color="#51258A"/>
</linearGradient>
<linearGradient id="hline" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#9B5DE5" stop-opacity="0"/><stop offset="0.5" stop-color="#C084FC"/><stop offset="1" stop-color="#9B5DE5" stop-opacity="0"/>
</linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#0B0714"/><stop offset="0.55" stop-color="#1A0F33"/><stop offset="1" stop-color="#2A1450"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#9B5DE5" stroke-opacity="0.09"/>
</pattern>
<radialGradient id="glow">
  <stop offset="0" stop-color="#9B5DE5" stop-opacity="0.55"/><stop offset="1" stop-color="#9B5DE5" stop-opacity="0"/>
</radialGradient>
<clipPath id="clip"><rect width="1000" height="200" rx="18"/></clipPath></defs>
<g clip-path="url(#clip)">
<rect width="1000" height="200" fill="url(#bg)"/>
<rect width="1000" height="200" fill="url(#grid)"/>
<path d="M0 168 Q 250 140 500 168 T 1000 168 V200 H0 Z" fill="#9B5DE5" fill-opacity="0.22"/>
<path d="M0 182 Q 250 158 500 182 T 1000 182 V200 H0 Z" fill="#9B5DE5" fill-opacity="0.18"/>
<rect x="150" y="0" width="700" height="3" fill="url(#hline)"><animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/></rect>
<text x="500" y="52" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="16" fill="#8B7BA8" letter-spacing="8">END OF TRANSMISSION</text>
<text x="500" y="106" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="2" fill="url(#nameg)">CURIOSITY → EXPERIMENTS → CODE → PROGRESS</text>
<text x="500" y="144" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="15" fill="#C084FC" letter-spacing="3">UNDERSTAND DEEPLY. BUILD INTELLIGENTLY.</text>
</g>
<rect x="0.5" y="0.5" width="999" height="199" rx="18" fill="none" stroke="#3B2670"/>
</svg>
